# nome e porta do backend
spring.application.name=start-students
server.port=8080

# banco H2 usado no prototipo
spring.datasource.url=jdbc:h2:mem:startstudents;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# cria as tabelas e depois carrega o data.sql
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# console para olhar os dados no navegador
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# configuracao local do token
app.jwt.secret=StartStudentsChaveLocal2026ComMaisDeTrintaEDoisCaracteres
app.jwt.expiration-ms=3600000
