<div class="foto-centro">
  <!-- Mostra a imagem escolhida ou um espaço reservado quando não há foto. -->
  <img
    *ngIf="foto"
    [src]="foto"
    alt="Pré-visualização da foto do aluno"
    class="preview"
  />
  <div *ngIf="!foto" class="sem-foto">Sem foto</div>

  <!-- O componente filho informa ao formulário qual arquivo foi selecionado. -->
  <label class="upload">
    <span>Adicionar foto</span>
    <input
      type="file"
      accept="image/jpeg,image/png"
      aria-label="Adicionar foto"
      (change)="selecionar.emit($event)"
    />
  </label>

  <!-- A remoção é controlada pelo formulário de cadastro ou edição. -->
  <button
    *ngIf="foto"
    type="button"
    class="secundario"
    (click)="remover.emit()"
  >
    Remover foto
  </button>
</div>
