<main class="detalhe-modal-page">
<div class="modal-fundo detalhe-fundo" (click)="voltar()">
<section class="detalhe-card detalhe-modal" role="dialog" aria-modal="true" aria-labelledby="titulo-detalhes" (click)="$event.stopPropagation()">
<h1 id="titulo-detalhes" class="form-titulo">Detalhes do Aluno</h1>
<div class="estado" *ngIf="carregando">Carregando...</div>
<div class="estado erro" *ngIf="erro">{{erro}}</div>
<ng-container *ngIf="aluno">
<div class="foto-centro">
<img *ngIf="aluno.foto" [src]="aluno.foto" [alt]="'Foto de '+aluno.nomeCompleto" class="preview">
<div *ngIf="!aluno.foto" class="sem-foto" aria-label="Aluno sem foto">Sem foto</div>
</div>
<div class="rotulo">Nome Completo</div>
<div class="valor">{{aluno.nomeCompleto}}</div>
<div class="rotulo">CPF</div>
<div class="valor">{{aluno.cpf}}</div>
<div class="rotulo">Email</div>
<div class="valor">{{aluno.email}}</div>
<div class="rotulo">Telefone</div>
<div class="valor">{{aluno.telefone}}</div>
<div class="rotulo">Matrícula</div>
<div class="valor">{{aluno.matricula}}</div>
<div class="rotulo">Status</div>
<p class="linha-status">
<span>
<i class="dot">
</i>{{aluno.status==='ATIVO'?'Ativo':'Inativo'}}</span>
</p>
<button class="voltar-btn" (click)="voltar()">Voltar</button>
</ng-container>
</section>
</div>
</main>
