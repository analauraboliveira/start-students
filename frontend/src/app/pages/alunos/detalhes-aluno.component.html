<main class="detalhe-modal-page">
  <div class="modal-fundo detalhe-fundo" (click)="voltar()">
    <section
      class="detalhe-card detalhe-modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="titulo-detalhes"
      (click)="$event.stopPropagation()"
    >
      <h1 id="titulo-detalhes" class="form-titulo">Detalhes do Aluno</h1>

      <div class="estado" *ngIf="carregando">Carregando...</div>
      <div class="estado erro" *ngIf="erro">{{ erro }}</div>

      <!-- O componente filho cuida apenas da apresentação dos dados. -->
      <ng-container *ngIf="aluno">
        <app-dados-aluno [aluno]="aluno"></app-dados-aluno>
        <button class="voltar-btn" (click)="voltar()">Voltar</button>
      </ng-container>
    </section>
  </div>
</main>
